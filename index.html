<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fernet Man — Córdoba Capital</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="game-shell">
    <div id="hud" aria-live="polite">
      <div class="hud-title">FERNET MAN</div>
      <div class="hud-row">
        <span class="hud-stat"><i class="bottle-icon"></i> <strong id="cans">0</strong></span>
        <span class="hud-stat hud-score">PUNTOS <strong id="score">0</strong></span>
        <span class="hud-stat">SALUD <strong id="health">♥♥♥</strong></span>
        <span class="hud-stat">VIDAS <strong id="lives">3</strong></span>
      </div>
      <div class="hud-progress">
        <span id="stage">NIVEL 1 — CENTRO HISTÓRICO</span>
        <div class="track"><i id="progress"></i></div>
        <strong><span id="timer">90</span>s · <span id="distance">0 m</span></strong>
      </div>
    </div>
    <div id="shout" aria-hidden="true"></div>
    <section id="overlay" class="visible">
      <div class="card">
        <div class="brand">FERNET<br><span>MAN</span></div>
        <h1 id="overlay-title">FERNET MAN</h1>
        <p id="overlay-message">Tocá para correr</p>
        <p class="hint">←/→ carril · ↑ saltar · ↓ agacharse</p>
        <p class="hint">Juntá 25 botellas para ganar una vida</p>
      </div>
    </section>
    <div id="touch-help">Deslizá el dedo para moverte</div>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
